name: Build Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            artifact_name: linux-packages
            package_command: npm run package:linux -- --publish never
          - os: windows-latest
            label: Windows
            artifact_name: windows-packages
            package_command: npm run package:win -- --publish never

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "const pkg = require('./package.json'); const tag = process.env.GITHUB_REF_NAME; if (tag !== 'v' + pkg.version) { throw new Error('Tag ' + tag + ' does not match package.json version ' + pkg.version); }"

      - name: Run tests
        run: npm test

      - name: Build distributable
        run: ${{ matrix.package_command }}

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.pacman
            release/*.exe
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release Assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate checksums
        run: |
          cd release-artifacts
          find . -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.pacman" -o -name "*.exe" \) -exec sha256sum {} + > checksums.sha256

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/linux-packages/*.AppImage
            release-artifacts/linux-packages/*.deb
            release-artifacts/linux-packages/*.rpm
            release-artifacts/linux-packages/*.pacman
            release-artifacts/windows-packages/*.exe
            release-artifacts/checksums.sha256
            tools/linux/register-adp-file-association.sh
            tools/windows/register-adp-file-association.reg
